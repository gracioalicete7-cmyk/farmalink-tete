<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://accounts.google.com https://wa.me https://api.whatsapp.com; object-src 'none'; base-uri 'self';" />
    <title>FarmaLink Tete — Encontre o seu medicamento. Encontre a sua farmácia.</title>
    <meta name="description" content="Plataforma digital para consulta e localização de medicamentos disponíveis nas farmácias da Cidade e Província de Tete, Moçambique." />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FarmaLink Tete" />
    <meta property="og:title" content="FarmaLink Tete — Encontre o seu medicamento" />
    <meta property="og:description" content="Plataforma digital para consulta e localização de medicamentos disponíveis nas farmácias da Província de Tete." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-['Plus_Jakarta_Sans',system-ui,-apple-system,sans-serif]">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#059669;color:#ffffff;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div style="width:72px;height:72px;background:rgba(255,255,255,0.2);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,0.12);">
          <img src="/favicon.png" alt="FarmaLink Tete" style="width:48px;height:48px;border-radius:12px;object-fit:cover;" />
        </div>
        <h1 style="font-size:22px;font-weight:700;letter-spacing:-0.02em;margin:0 0 8px 0;color:#ffffff;">FarmaLink Tete</h1>
        <p style="font-size:14px;color:#d1fae5;margin:0 0 28px 0;max-width:280px;line-height:1.4;">Farmácias & Medicamentos em Tete, Moçambique</p>
        <div style="display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.12);padding:8px 16px;border-radius:999px;">
          <div style="width:16px;height:16px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#ffffff;border-radius:50%;animation:farmalink-spin 0.8s linear infinite;"></div>
          <span style="font-size:13px;font-weight:500;color:#ecfdf5;">A carregar farmácias...</span>
        </div>
        <style>
          @keyframes farmalink-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
